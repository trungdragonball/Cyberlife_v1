<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberLife AI Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-lg text-white shadow-lg">
                CL
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">CyberLife V1</h1>
                <p class="text-xs text-emerald-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span> Online
                </p>
            </div>
        </div>
        <div class="text-xs text-slate-400">
            v1.0.0
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <!-- Welcome Message -->
        <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>
            <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-none p-3.5 max-w-[80%] text-sm text-slate-200 shadow-sm">
                Xin chào! Tôi là **CyberLife AI Assistant**. Tôi có thể giúp gì cho bạn hôm nay?
            </div>
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4">
        <div class="max-w-4xl mx-auto flex items-center gap-2">
            <input 
                type="text" 
                id="userInput" 
                onkeypress="handleKeyPress(event)"
                placeholder="Nhập tin nhắn..." 
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500 transition-colors"
            />
            <button 
                onclick="sendMessage()" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-3 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </footer>

    <!-- Logic JS -->
    <script>
        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const message = input.value.trim();
            if (!message) return;

            // Render tin nhắn User
            chatBox.innerHTML += `
                <div class="flex items-start justify-end gap-3">
                    <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-none p-3.5 max-w-[80%] text-sm shadow-sm">
                        ${escapeHtml(message)}
                    </div>
                </div>
            `;
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Render Typing Indicator
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-none p-3.5 text-sm text-slate-400 flex items-center gap-1">
                        <span class="animate-bounce">.</span><span class="animate-bounce delay-100">.</span><span class="animate-bounce delay-200">.</span>
                    </div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('http://localhost:8000/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, owner_id: "user123" })
                });
                const data = await response.json();
                
                // Xóa Typing indicator
                document.getElementById(loadingId)?.remove();

                const replyText = data.response || data.message || JSON.stringify(data);

                // Render tin nhắn AI
                chatBox.innerHTML += `
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-none p-3.5 max-w-[80%] text-sm text-slate-200 shadow-sm">
                            ${escapeHtml(replyText)}
                        </div>
                    </div>
                `;
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center text-xs font-bold shrink-0">!</div>
                        <div class="bg-red-950/50 border border-red-800 text-red-300 rounded-2xl rounded-tl-none p-3.5 text-sm">
                            Không thể kết nối tới server API!
                        </div>
                    </div>
                `;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/[&<"']/g, m => ({ '&': '&amp;', '<': '&lt;', '"': '&quot;', "'": '&#039;' }[m]));
        }
    </script>
</body>
</html>
