<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CyberLife AI Chat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; }
        #chat-box { height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .user { color: blue; text-align: right; margin: 5px 0; }
        .bot { color: green; text-align: left; margin: 5px 0; }
        input { width: 80%; padding: 10px; }
        button { padding: 10px 15px; }
    </style>
</head>
<body>
    <h2>CyberLife V1 Assistant</h2>
    <div id="chat-box"></div>
    <input type="text" id="userInput" placeholder="Nhập tin nhắn..." />
    <button onclick="sendMessage()">Gửi</button>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const message = input.value.trim();
            if (!message) return;

            chatBox.innerHTML += `<div class="user"><b>Bạn:</b> ${message}</div>`;
            input.value = '';

            try {
                const response = await fetch('http://localhost:8000/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                chatBox.innerHTML += `<div class="bot"><b>CyberLife:</b> ${data.response || JSON.stringify(data)}</div>`;
            } catch (err) {
                chatBox.innerHTML += `<div class="bot" style="color:red">Lỗi kết nối API!</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
